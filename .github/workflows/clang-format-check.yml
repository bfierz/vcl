# https://github.com/marketplace/actions/clang-format-check
name: clang-format Check
on: [push, pull_request]
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run clang-format style check for C/C++ programs.
      uses: jidicula/clang-format-action@v4.18.0
      with:
        # Keep in sync with the clang-format package in .devcontainer/Dockerfile (Ubuntu 24.04 ships 18)
        clang-format-version: '18'
        check-path: 'src'
        exclude-regex: '.*/externals/.*|.*/3rdparty/.*|.*/simd/detail/.*|.*/math/mcadams/.*|.*/tests/vcl.geometry/ref/.*'
        # The action's default filter plus .inl files
        include-regex: '^.*\.((((c|C)(c|pp|xx|\+\+)?$)|((h|H)h?(pp|xx|\+\+)?$))|(ino|pde|proto|cu|inl))$'

# Alternative https://github.com/marketplace/actions/clang-format-lint
# Format all: find ./src -path "*/externals/*" -prune -o -path "*/3rdparty/*" -prune -o -path "*/simd/detail/*" -prune -o -path "*/math/mcadams/*" -prune -o -path "*/tests/vcl.geometry/ref/*" -prune -o -name \*.h -print0 -o -name \*.cpp -print0 -o -name \*.inl -print0 | xargs -0 clang-format-18 -i
